spring.application.name=bazarak

# Server
server.port=8080
server.servlet.context-path=/api

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Upload directory
app.upload.dir=uploads

# DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.com.bazarak=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ============================================
# SQL SERVER - SQL AUTHENTICATION
# ============================================

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://Arphist\\ALISQLSERVER2022;databaseName=bazarak;encrypt=true;trustServerCertificate=true

# Use the EXACT credentials you set
spring.datasource.username=bazarak_app
spring.datasource.password=BazarakApp2024!

# ============================================
# JPA / HIBERNATE
# ============================================

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.connection-timeout=60000

# Serve static files from profile-photos directory
spring.web.resources.static-locations=file:profile-photos/,classpath:/static/,classpath:/public/
spring.web.resources.add-mappings=true